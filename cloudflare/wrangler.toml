name = "gastos"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# La página (public/) se sirve directo; solo /api/* pasa por el Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "gastos"
# Reemplaza con el "database_id" que te da:  npx wrangler d1 create gastos
database_id = "PEGA-AQUI-EL-DATABASE-ID"
migrations_dir = "migrations"
